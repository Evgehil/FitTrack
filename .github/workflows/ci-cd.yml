name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Linter Configs (Mock)
        run: |
          echo "Проверка наличия конфигурации Checkstyle..."
          if [ -f "backend/build.gradle" ]; then echo "OK: Файл найден"; else echo "ОШИБКА: Файл не найден"; exit 1; fi
          
      - name: Run Tests (Mock)
        run: echo "Запуск тестов JUnit... 100% Pass"

  mobile-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter Analyze (Mock)
        run: |
          echo "Запуск статического анализа Dart..."
          if [ -f "mobile-app/analysis_options.yaml" ]; then echo "OK: Файл найден"; else echo "ОШИБКА: Файл не найден"; exit 1; fi